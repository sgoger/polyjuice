version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/spikes"]
    schedule:
      interval: weekly
    groups:
      # Une seule PR par semaine pour les mises à jour mineures et correctives.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
